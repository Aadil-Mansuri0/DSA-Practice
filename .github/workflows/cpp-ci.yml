name: C++ DSA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Syntax-check C++ solutions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.cpp' -not -path './.git/*')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C++ source files found."
            exit 0
          fi
          for file in "${files[@]}"; do
            echo "Checking $file"
            g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only "$file"
          done
